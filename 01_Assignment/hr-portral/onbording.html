<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Onbording Form</title>
</head>
<body class="onboarding-page">
    <div class="container">
    <form class="onbord-form" action="www.google.com" method="GET">
        <h2>Form of Onbording</h2>
        <div><label for="name">Full name</label></div>
        <div><input type="text" placeholder="Enter name" id="name" name="name"></div>

        <div><label for="email">Offical email</label></div>
        <div><input type="email" placeholder="Enter email" id="email" name="email"></div>

        <div><label for="password">Temporary password</label></div>
        <div><input type="password" placeholder="Enter password" id="password" name="password"></div>

        <div><label for="dob-date">Date of Birth</label></div>
        <div><input type="date" placeholder="Enter DOB date" id="dob-date" name="dob-date"></div>

        <div><label for="join-date">Joining Date</label></div>
        <div><input type="date" placeholder="Enter Joining date" id="join-date" name="join-date"></div>

        <div><label for="slot-time">Orientation slot</label></div>
        <div><input type="datetime-local" id="slot-time" name="slot-time"></div>

        <div><label for="report-time">Reporting time on day one</label></div>
        <div><input type="time" id="report-time" name="report-time"></div>

        <div><label for="gender">Gender</label></div>
        <div>
            <input type="radio" id="gender" value="gender">
            <label>Male</label>
            <input type="radio" id="gender" value="gender">
            <label>Female</label>
        </div>

        <div><label for="qualification">Highest qualification</label></div>
        <div>
            <select name="qualification" id="qualification">
                <option value="SSC">SSC</option>
                <option value="HSC">HSC</option>
                <option value="BE">BE</option>
                <option value="ME">ME</option>
            </select>
        </div>

        <div><label for="department">Department</label></div>
        <div>
            <select name="department" id="department">
                <option value="IT">IT</option>
                <option value="finance">Finance</option>
                <option value="mechanical">Mechanical</option>
                <option value="civil">Civil</option>
            </select>
        </div>

        <div><label for="address">Current address</label></div>
        <textarea name="address" id="address" placeholder="Enter address"></textarea>


        <div><label for="file">Passport photo or resume</label></div>
        <div><input type="file" id="file" name="file"></div>

        <div><input type="checkbox" name="declaration">Declaration</div>

        <div class="btn">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <button type="button">Need help?</button>
        </div>

    </form>
    </div>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3771.8597825275274!2d73.05167127505077!3d19.025899382168387!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c24cce39457b%3A0x8bd69eab297890b0!2sCentre%20for%20Development%20of%20Advanced%20Computing%20(CDAC)!5e0!3m2!1sen!2sin!4v1792838601617!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
