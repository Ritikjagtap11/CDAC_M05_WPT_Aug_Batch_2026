<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/contact.css">
    <title>contact</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-logo">
                <img src="images/photo.png" />
                <h2>| Ritik Jagtap</h2>
            </div>
            <div class="header-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Project</a>
                <a href="">Experience</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>

        <div class="contact-form">

            <form action="#" method="POST">
                <h2>Contact Me</h2>
                <p>Feel free to get in touch with me.</p>
                <div>
                    <div>
                        <label for="name">Name</label>
                    </div>
                    <div>
                        <input type="text" id="name" name="name" placeholder="Enter name">
                    </div>
                </div>

                <div>
                    <div>
                        <label for="email">Email</label>
                    </div>
                    <div>
                        <input type="email" id="email" name="email" placeholder="Enter email">
                    </div>
                </div>

                <div>
                    <div>
                        <label for="date">Contact Date</label>
                    </div>
                    <div>
                        <input type="date" id="date" name="date">
                    </div>
                </div>

                <div>
                    <div>
                        <label for="enquiry">Enquiry Type</label>
                    </div>
                    <div>
                        <select name="enquiry" id="enquiry">
                            <option value="1">Full Stack Developer</option>
                            <option value="2">Database Integration</option>
                            <option value="3">Backend Developer</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div>
                        <label>Contact Mode</label>
                    </div>
                    <div>
                        <input type="radio" id="phone" name="contact-mode" value="phone">
                        <label for="phone">Phone</label>

                        <input type="radio" id="message" name="contact-mode" value="message">
                        <label for="message">Message</label>
                    </div>
                </div>

                <div>
                    <div>
                        <label for="file">Upload File</label>
                    </div>
                    <div>
                        <input type="file" id="file" name="file">
                    </div>
                </div>

                <div>
                    <div>
                        <input type="submit" value="Submit">
                    </div>
                </div>
            </form>

        </div>
    </div>


</body>

</html>
